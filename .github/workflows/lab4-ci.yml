name: Lab4 - build e testes

on:
  push:
    branches: [main]
    paths:
      - "Lab4/**"
      - ".github/workflows/lab4-ci.yml"
  pull_request:
    paths:
      - "Lab4/**"
      - ".github/workflows/lab4-ci.yml"

jobs:
  build-and-test:
    name: Compilar contratos, rodar testes e buildar o frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Lab4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "Lab4/.nvmrc"
          cache: "npm"
          cache-dependency-path: Lab4/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Compilar contratos (Hardhat)
        run: npm run chain:build

      - name: Rodar testes dos contratos
        run: npm run chain:test

      - name: Buildar o frontend (TypeScript + Vite)
        run: npm run frontend:build
